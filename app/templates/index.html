<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parkbay – Find a garage slot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F7F4EC',
            mist: '#DDE6E4',
            navy: '#0A2438',
            ink: '#1F2729',
            gold: '#C9AB6F'
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="min-h-screen bg-cream font-sans text-ink antialiased">
  <!-- route : / -->
  <div class="mx-auto max-w-6xl px-4 pt-4">
    <nav class="flex items-center justify-between rounded-full bg-mist px-6 py-3">
      <a href="/" class="text-lg font-extrabold tracking-tight text-navy">Parkbay</a>
      <a href="/auth/login" class="rounded-full bg-navy px-5 py-2 text-sm font-semibold text-cream transition hover:bg-ink focus:outline-none focus:ring-2 focus:ring-gold">Login / Register</a>
    </nav>

    <!-- Map Container -->
    <section class="mt-6 overflow-hidden rounded-3xl bg-ink shadow-lg">
      <div id="map" class="h-[75vh] min-h-[600px] w-full z-10 flex items-center justify-center text-cream font-semibold text-sm">
        📍 Requesting your exact location access...
      </div>
    </section>

    <section class="mx-auto max-w-2xl px-2 py-16 text-center">
      <h1 class="text-4xl font-extrabold leading-tight tracking-tight text-navy sm:text-5xl">Find a garage slot before you leave home.</h1>
      <p class="mt-5 text-lg text-ink/80">Pick a garage near your exact location, check available hours, and reserve a spot.</p>
      <a href="/auth/register" class="mt-8 inline-block rounded-full bg-gold px-7 py-3 font-bold text-navy transition hover:brightness-95 focus:outline-none focus:ring-2 focus:ring-navy">Create a free account</a>
    </section>
  </div>

  <footer class="bg-cream py-12 text-center text-ink">
    <hr class="border-navy/10">
    <p class="text-lg font-bold mt-8">Parkbay</p>
    <p class="mt-2 text-sm">Garage slot booking for riders and drivers.</p>
    <p class="mt-6 text-xs">&copy; 2026 Parkbay</p>
  </footer>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // Request exact browser geolocation immediately (No fallback center)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          // 1. Initialize map strictly at user's exact GPS coordinates
          const map = L.map('map').setView([userLat, userLng], 14);

          // 2. Add OpenStreetMap Tile Layer
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }).addTo(map);

          // 3. Drop marker for user's exact position
          L.marker([userLat, userLng]).addTo(map)
            .bindPopup('<div class="p-1 font-sans text-navy font-bold">📍 You are here</div>')
            .openPopup();

          // 4. Generate dummy checkpoints dynamically relative to user's real coordinates
          const checkpoints = [
            {
              name: "SNM Hostel",
              address: "SNM Boy's Hostel , CITK",
              coords: [26.477778, 90.300729],
              timing: "04:00 - 21:00",
              url: "/garage/Remsan/1"
            },
            {
              name: "CIT Kokrajhar Parking",
              address: "Front of CITK main gate",
              coords: [26.476789, 90.301366],
              timing: "05:00 - 20:00",
              url: "/garage/Remsan/2"
            },
            {
              name: "Mahendra Nibas",
              address: "On Boroland University Road , Near CITK turning",
              coords: [26.476371, 90.297928],
              timing: "09:00 - 19:00",
              url: "/garage/Abhijit/3"
            }
          ];

          // 5. Render checkpoints with popup cards and booking link redirection
          checkpoints.forEach(point => {
            const marker = L.marker(point.coords).addTo(map);

            const cardHtml = `
              <div class="p-1 font-sans text-ink">
                <h3 class="text-base font-extrabold text-navy m-0">${point.name}</h3>
                <p class="text-xs text-ink/70 mt-1 mb-2">${point.address}</p>
                <div class="inline-block rounded-full bg-mist px-2.5 py-0.5 text-xs font-semibold text-navy mb-3">
                  ${point.timing}
                </div>
                <div>
                  <a href="${point.url}" class="inline-block w-full rounded-full bg-navy px-4 py-2 text-center text-xs font-bold text-cream hover:bg-gold hover:text-navy transition focus:outline-none">
                    View Slots & Book &rarr;
                  </a>
                </div>
              </div>
            `;

            marker.bindPopup(cardHtml, { maxWidth: 240 });
          });
        },
        (error) => {
          document.getElementById('map').innerHTML = `
            <div style="padding: 24px; text-align: center; color: #F7F4EC;">
              <p style="font-weight: 700; font-size: 16px; margin-bottom: 8px;">Location Permission Required</p>
              <p style="font-size: 13px; opacity: 0.8;">Please enable location access in your browser settings to view garages around you.</p>
            </div>
          `;
          console.error("Geolocation denied or unavailable:", error);
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    } else {
      document.getElementById('map').innerHTML = '<div style="padding: 24px; text-align: center; color: #F7F4EC;">Geolocation is not supported by your browser.</div>';
    }
  </script>
</body>
</html>
