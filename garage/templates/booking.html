<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer details – Parkbay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F7F4EC',
            mist: '#DDE6E4',
            navy: '#0A2438',
            ink: '#1F2729',
            gold: '#C9AB6F'
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-cream font-sans text-ink antialiased">
  <main class="mx-auto flex min-h-screen max-w-2xl items-center px-4 py-10">
    <div class="w-full rounded-[2rem] bg-mist p-5 md:p-8">
      <!-- Dynamic form action pointing to the current garage route -->
      <form action="/garage/qr/{{ username }}/{{ garage.id }}" method="post" class="flex flex-col gap-5 rounded-2xl bg-navy p-6 text-cream shadow-lg">
        <h1 class="text-2xl font-extrabold">Customer details ({{ garage.name }})</h1>
        <div>
          <label for="name" class="mb-1.5 block text-sm font-semibold text-cream">Name</label>
          <input id="name" name="name" type="text" required autocomplete="name" class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40" />
        </div>
        <div>
          <label for="vehicle-type" class="mb-1.5 block text-sm font-semibold text-cream">Vehicle type</label>
          <select id="vehicle-type" name="vehicle_type" required class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40">
            <option value="" class="text-ink">Select</option>
            <option value="two" class="text-ink">Two wheeler</option>
            <option value="four" class="text-ink">Four wheeler</option>
          </select>
        </div>
        <div>
          <label for="vehicle_no" class="mb-1.5 block text-sm font-semibold text-cream">Vehicle no.</label>
          <input id="vehicle_no" name="vehicle_no" type="text" required placeholder="AS 01 AB 1234" class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40" />
        </div>
        <div>
          <label for="contact" class="mb-1.5 block text-sm font-semibold text-cream">Contact</label>
          <input id="contact" name="contact" type="tel" required autocomplete="tel" placeholder="+91" class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40" />
        </div>
        <button type="submit" class="mt-2 rounded-full bg-gold px-6 py-3 font-bold text-navy transition hover:brightness-95 focus:outline-none focus:ring-2 focus:ring-cream">Park</button>
      </form>
    </div>
  </main>
</body>
</html>
