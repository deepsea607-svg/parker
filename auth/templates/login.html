<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in – Parkbay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#F7F4EC",
              mist: "#DDE6E4",
              navy: "#0A2438",
              ink: "#1F2729",
              gold: "#C9AB6F",
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-cream font-sans text-ink antialiased">
    <!-- route : /auth/login -->
    <main class="mx-auto flex min-h-screen max-w-4xl items-center px-4 py-10">
      <div
        class="grid w-full gap-6 rounded-[2rem] bg-mist p-5 md:grid-cols-2 md:p-8"
      >
        <div class="flex flex-col justify-center gap-3 p-4 text-navy md:p-8">
          <h2 class="text-3xl font-extrabold leading-tight">Welcome back.</h2>
          <p class="text-ink/80">
            Log in to manage your bookings or your garages.
          </p>
          <a
            href="/auth/register"
            class="mt-2 w-fit font-semibold underline decoration-gold decoration-2 underline-offset-4 hover:text-ink"
            >Create a new account</a
          >
        </div>
        <form
          id="loginForm"
          novalidate
          class="flex flex-col gap-5 rounded-2xl bg-navy p-6 text-cream shadow-lg"
        >
          <h1 class="text-2xl font-extrabold">Login form</h1>
          <div>
            <label
              for="username"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Username</label
            >
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            />
          </div>
          <div>
            <label
              for="password"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            />
          </div>
          <p
            id="formMsg"
            role="alert"
            class="hidden rounded-lg px-3 py-2 text-sm font-semibold"
          ></p>
          <button
            id="loginBtn"
            type="submit"
            class="mt-4 rounded-full bg-gold px-6 py-3 font-bold text-navy transition hover:brightness-95 focus:outline-none focus:ring-2 focus:ring-cream disabled:opacity-60"
          >
            Login
          </button>
        </form>
      </div>
    </main>
    <script>
      const form = document.getElementById("loginForm");
      const msg = document.getElementById("formMsg");
      const btn = document.getElementById("loginBtn");

      function showMsg(text, ok = false) {
        msg.textContent = text;
        msg.className =
          "rounded-lg px-3 py-2 text-sm font-semibold " +
          (ok
            ? "bg-green-500/20 text-green-200"
            : "bg-red-500/20 text-red-200");
      }

      function fail(text, fieldId) {
        showMsg(text);
        if (fieldId) document.getElementById(fieldId).focus();
        return false;
      }

      function validate(v) {
        if (!v.username) return fail("Please enter your username.", "username");
        if (v.username.length < 3 || v.username.length > 50)
          return fail("Username must be 3-50 characters.", "username");
        if (!v.password) return fail("Please enter your password.", "password");
        if (v.password.length < 6)
          return fail("Password must be at least 6 characters.", "password");
        return true;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "hidden";

        const values = {
          username: form.username.value.trim(),
          password: form.password.value.trim(),
        };

        if (!validate(values)) return;

        btn.disabled = true;
        btn.textContent = "Logging in...";

        try {
          const res = await fetch("/auth/login-api", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(values),
          });

          let data = {};
          try {
            data = await res.json();
          } catch (_) {}

          if (res.ok) {
            showMsg("Login successful. Redirecting...", true);
            setTimeout(() => (window.location.href = "/garage/admin"), 800);
          } else {
            showMsg(
              "Login failed (" + res.status + ").",
            );
            btn.disabled = false;
            btn.textContent = "Login";
          }
        } catch (err) {
          showMsg(
            "Could not reach the server. Check your connection and try again.",
          );
          btn.disabled = false;
          btn.textContent = "Login";
        }
      });
    </script>
  </body>
</html>
