<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account – Parkbay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#F7F4EC",
              mist: "#DDE6E4",
              navy: "#0A2438",
              ink: "#1F2729",
              gold: "#C9AB6F",
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-cream font-sans text-ink antialiased">
    <!-- route : /auth/registration -->
    <main class="mx-auto flex min-h-screen max-w-4xl items-center px-4 py-10">
      <div
        class="grid w-full gap-6 rounded-[2rem] bg-mist p-5 md:grid-cols-2 md:p-8"
      >
        <form
          id="regForm"
          novalidate
          class="flex flex-col gap-5 rounded-2xl bg-navy p-6 text-cream shadow-lg"
        >
          <h1 class="text-2xl font-extrabold">Sign-up form</h1>
          <div>
            <label
              for="name"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Your name</label
            >
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            />
          </div>
          <div>
            <label
              for="email"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Email address</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            />
          </div>
          <div>
            <label
              for="contact"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Contact number</label
            >
            <input
              id="contact"
              name="contact"
              type="tel"
              autocomplete="tel"
              placeholder="+91"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            />
          </div>
          <div>
            <label
              for="address"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Address</label
            >
            <textarea
              id="address"
              name="address"
              rows="3"
              autocomplete="street-address"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            ></textarea>
          </div>
          <div>
            <label
              for="password"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            />
          </div>
          <div>
            <label
              for="confirm"
              class="mb-1.5 block text-sm font-semibold text-cream"
              >Confirm password</label
            >
            <input
              id="confirm"
              name="confirm"
              type="password"
              autocomplete="new-password"
              required
              class="w-full rounded-lg border border-cream/30 bg-white/5 px-3 py-2.5 text-cream placeholder-cream/40 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40"
            />
          </div>
          <p
            id="formMsg"
            role="alert"
            class="hidden rounded-lg px-3 py-2 text-sm font-semibold"
          ></p>
          <button
            id="regBtn"
            type="submit"
            class="mt-4 rounded-full bg-gold px-6 py-3 font-bold text-navy transition hover:brightness-95 focus:outline-none focus:ring-2 focus:ring-cream disabled:opacity-60"
          >
            Register
          </button>
        </form>
        <div class="flex flex-col justify-center gap-3 p-4 text-navy md:p-8">
          <h2 class="text-3xl font-extrabold leading-tight">Park smarter.</h2>
          <p class="text-ink/80">
            Make an account to book a slot and see your parking history.
          </p>
          <a
            href="/auth/login"
            class="mt-2 w-fit font-semibold underline decoration-gold decoration-2 underline-offset-4 hover:text-ink"
            >I already have an account</a
          >
        </div>
      </div>
    </main>
    <script>
      const form = document.getElementById("regForm");
      const msg = document.getElementById("formMsg");
      const btn = document.getElementById("regBtn");

      function showMsg(text, ok = false) {
        msg.textContent = text;
        msg.className =
          "rounded-lg px-3 py-2 text-sm font-semibold " +
          (ok
            ? "bg-green-500/20 text-green-200"
            : "bg-red-500/20 text-red-200");
      }

      function fail(text, fieldId) {
        showMsg(text);
        if (fieldId) document.getElementById(fieldId).focus();
        return false;
      }

      function validate(v) {
        if (!v.name) return fail("Please enter your name.", "name");
        if (v.name.length < 3 || v.name.length > 50)
          return fail("Name must be 3-50 characters.", "name");

        if (!v.email) return fail("Please enter your email address.", "email");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email))
          return fail("Please enter a valid email address.", "email");

        if (!v.contact)
          return fail("Please enter your contact number.", "contact");
        if (!/^\d{10,15}$/.test(v.contact))
          return fail("Contact must be 10-15 digits.", "contact");

        if (!v.address) return fail("Please enter your address.", "address");
        if (v.address.length < 5)
          return fail("Address looks too short.", "address");

        if (!v.password) return fail("Please enter a password.", "password");
        if (v.password.length < 6)
          return fail("Password must be at least 6 characters.", "password");
        if (!/[A-Za-z]/.test(v.password) || !/\d/.test(v.password))
          return fail(
            "Password must contain at least one letter and one number.",
            "password",
          );

        if (v.password !== v.password2)
          return fail("Passwords do not match.", "confirm");

        return true;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "hidden";

        // collect + clean values
        const values = {
          name: form.name.value.trim(),
          email: form.email.value.trim().toLowerCase(),
          // remove spaces, dashes, brackets and a leading + (so "+91 98765-43210" becomes "919876543210")
          contact: form.contact.value.replace(/[\s\-()+]/g, ""),
          address: form.address.value.trim(),
          password: form.password.value.trim(),
          password2: form.confirm.value.trim(),
        };

        if (!validate(values)) return;

        // keys match what /auth/reg-api expects
        const payload = {
          username: values.name,
          email: values.email,
          contact: values.contact,
          address: values.address,
          password: values.password,
          password2: values.password2,
        };

        btn.disabled = true;
        btn.textContent = "Registering...";

        try {
          const res = await fetch("/auth/reg-api", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          let data = {};
          try {
            data = await res.json();
          } catch (_) {}

          if (res.ok) {
            showMsg(
              "Account created" +
                (data.serial_no ? " (ID: " + data.serial_no + ")" : "") +
                ". Redirecting to login...",
              true,
            );
            form.reset();
            setTimeout(() => (window.location.href = "/auth/login"), 1500);
          } else {
            showMsg(
              data.msg ||
                data.message ||
                "Registration failed (" + res.status + ").",
            );
            btn.disabled = false;
            btn.textContent = "Register";
          }
        } catch (err) {
          showMsg(
            "Could not reach the server. Check your connection and try again.",
          );
          btn.disabled = false;
          btn.textContent = "Register";
        }
      });
    </script>
  </body>
</html>
