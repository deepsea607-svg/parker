<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3f5f9;
			color: #172033;
			font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		.login-card {
			width: min(100%, 420px);
			padding: 40px;
			border: 1px solid #e5e9f0;
			border-radius: 16px;
			background: #fff;
			box-shadow: 0 16px 40px rgb(23 32 51 / 8%);
		}
		h1 { margin: 0 0 8px; font-size: 1.75rem; }
		.intro { margin: 0 0 28px; color: #647087; }
		.field { margin-bottom: 18px; }
		label { display: block; margin-bottom: 7px; font-weight: 600; }
		input {
			width: 100%;
			padding: 12px 14px;
			border: 1px solid #cbd2df;
			border-radius: 8px;
			background: #fff;
			color: inherit;
			font: inherit;
		}
		input:focus { outline: 3px solid rgb(67 97 238 / 20%); border-color: #4361ee; }
		.form-options { display: flex; justify-content: space-between; gap: 12px; margin: 4px 0 24px; font-size: .9rem; }
		.remember { display: flex; align-items: center; gap: 8px; }
		.remember input { width: auto; margin: 0; }
		a { color: #3654d4; text-decoration: none; }
		a:hover { text-decoration: underline; }
		button {
			width: 100%;
			padding: 12px 16px;
			border: 0;
			border-radius: 8px;
			background: #3654d4;
			color: #fff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #2945bd; }
		.signup { margin: 22px 0 0; text-align: center; color: #647087; font-size: .95rem; }
		@media (max-width: 480px) { .login-card { padding: 30px 24px; } }
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Welcome back</h1>
		<p class="intro">Sign in to your account to continue.</p>
		<form action="" method="post">
			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" autocomplete="email" required>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required>
			</div>
			<div class="form-options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="/forgot-password">Forgot password?</a>
			</div>
			<button type="submit">Sign in</button>
		</form>
		<p class="signup">Don't have an account? <a href="/signup">Create one</a></p>
	</main>
</body>
</html>
